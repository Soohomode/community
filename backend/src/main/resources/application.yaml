spring:

  datasource:
    url: jdbc:mysql://localhost:3306/community_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false

  server:
    port: 8080

  application:
    name: community

  jwt:
    secret: ${JWT_SECRET}

  data:
    redis:
      host: localhost
      port: 6379